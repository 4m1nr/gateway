# Generated by `gw apply`.
#
# Start AdGuard after the tunnel is up. Its upstream DoH rides the tunnel, so
# starting first means a burst of failed lookups at boot — and a resolver that
# caches those failures serves them to the LAN for as long as the negative TTL
# lasts.
#
# Wants=, not Requires=: if the tunnel never comes up, AdGuard should still
# serve the LAN, resolving domestic names directly.
[Unit]
After=xray.service
Wants=xray.service
PartOf=gateway.target

[Install]
WantedBy=gateway.target
