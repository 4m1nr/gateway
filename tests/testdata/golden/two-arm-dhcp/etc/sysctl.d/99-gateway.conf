# Generated by `gw apply` — DO NOT EDIT ON THE BOX
net.ipv4.ip_forward = 1

# TPROXY requires loose/disabled reverse path filtering: the reply path for an
# intercepted flow does not match the kernel's idea of where it came from.
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0
net.ipv4.conf.eth0.rp_filter = 0
net.ipv4.conf.eth1.rp_filter = 0

# The LAN and the uplink are separate segments here, so the box has no
# reason to redirect anyone. It is still off: a second router appearing on
# the office LAN would give it one, and a client that takes the hint has
# left the tunnel without anything here saying so.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0

# IPv6 off on the LAN side only. A blanket all.disable_ipv6 would
# break Tailscale, which uses IPv6 for its own tailnet addressing.
net.ipv6.conf.eth0.disable_ipv6 = 1
net.ipv6.conf.eth0.accept_ra = 0
net.ipv6.conf.eth1.disable_ipv6 = 1
net.ipv6.conf.eth1.accept_ra = 0

# IPv6 forwarding stays ON even with IPv6 off on the LAN, and it is
# the tailnet that needs it. `--advertise-exit-node` advertises
# ::/0 as well as 0.0.0.0/0 — there is no v4-only exit node — so
# Tailscale checks v6 forwarding and reports the box as broken
# without it: "Subnet routing is enabled, but IP forwarding is
# disabled."
#
# It also matches what the firewall already allows: the ruleset
# drops IPv6 everywhere except from tailscale0, so leaving the
# kernel knob off meant the two disagreed, with the kernel
# silently winning. The LAN side cannot leak either way, because
# eth0 and eth1 have no IPv6 at all.
net.ipv6.conf.all.forwarding = 1
net.ipv6.conf.default.forwarding = 1

# Throughput
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1

# A gateway holds far more conntrack entries than a workstation
net.netfilter.nf_conntrack_max = 131072
net.nf_conntrack_max = 131072
fs.file-max = 1048576
