# Generated by `gw apply` — DO NOT EDIT ON THE BOX
#
# gw-network.service installs the fwmark policy rule and the LAN reverse-path
# rule before network-pre.target, which is before systemd-networkd has started.
# networkd's default (ManageForeignRoutingPolicyRules=yes) is to delete every
# routing policy rule it did not configure itself the moment it comes up — so
# on every boot the rules are installed correctly and then removed seconds
# later, by a service that is doing exactly what it was told to.
#
# What that looks like from outside is the worst kind of failure: the ruleset
# is loaded, Xray is listening, the tunnel is genuinely up, and not one
# intercepted packet reaches it, because marked packets never get the table
# lookup that delivers them locally. `gw apply` appears to fix it — its last
# act restarts gw-network, which re-adds the rules, and this time networkd is
# already up and no longer reconciling. Until the next boot.
#
# Nothing is given up by turning it off: the .network file declares no
# [RoutingPolicyRule] of its own, so there are no rules here for networkd to
# manage.
[Network]
ManageForeignRoutingPolicyRules=no
