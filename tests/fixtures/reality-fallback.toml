# ============================================================================
#  Gateway — single source of truth
#
#  Copy to gateway.toml (gitignored) or generate it with `gw init`.
#  Every config on the box is rendered from this file: `gw apply`.
#  Nothing here is edited on the box directly — edit here, re-apply.
# ============================================================================

[net]
# Interface facing the router. `gw init` detects this.
wan_if     = "eth0"
# The home LAN this box sits on.
lan_cidr   = "192.168.1.0/24"
# The router (this box's own default gateway).
router     = "192.168.1.1"
# Static address for this box. MUST be outside the router's DHCP pool.
static_ip  = "192.168.1.2"
prefix_len = 24

[ipv6]
# "off"  — disable v6 on wan_if and drop forwarded v6 (recommended, and what
#          this setup is built around: opt-in-per-device cannot control a v6
#          default route, which comes from the router's RAs).
# "pass" — leave v6 alone entirely (leaks around the tunnel; do not use unless
#          you know why you want it).
mode = "off"

# ============================================================================
#  Xray
# ============================================================================
[xray]
tproxy_port     = 12345    # dokodemo-door, TPROXY target
socks_port      = 10808    # loopback only, for manual use + health probes
http_port       = 10809    # loopback only
api_port        = 10085    # loopback-only stats API, used by `gw check`
log_level       = "warning"
domain_strategy = "IPIfNonMatch"
# SO_MARK stamped on every Xray outbound so its own packets skip the OUTPUT
# marking rule. Changing this means changing the nftables rule too.
outbound_mark   = 255

# The primary outbound: a complete Xray outbound object, used verbatim.
#
# The gateway does not model protocols or transports — paste whatever Xray
# supports (VLESS/XHTTP, Reality, Trojan, Shadowsocks, a chain, ...). Two
# fields are always overridden, because the gateway depends on them:
#
#   tag             routing rules reference it
#   sockopt.mark    the loop guard; without it Xray's own packets are
#                   re-captured by TPROXY and the gateway deadlocks
#
# `gw init` writes this file for you from a vless:// share link.
[xray.outbound]
file = "outbounds/reality.json"          # or: json = """ { ... } """

# Optional. Pins the server's address so the tunnel never needs DNS to come up
# — otherwise that is a real boot-time chicken-and-egg. Leave empty for a
# CDN-fronted host whose IP legitimately rotates.
server_ip = ""

# Only needed when the address cannot be read out of the outbound automatically
# (unusual protocols). It is what gets resolved via a direct resolver.
# server_domain = ""

# Optional second outbound. When enabled, Xray load-balances with a burst
# observatory so a dead server fails over instead of taking you offline.
[xray.fallback]
enabled = true
file    = "outbounds/backup.json"

# ============================================================================
#  Extra upstreams
#
#  More Xray servers that profiles can send selected traffic through — a work
#  VPN, a second exit country. Same form as [xray.outbound]: a complete Xray
#  outbound object, used verbatim. `name` becomes the outbound tag, so keep it
#  to lowercase letters, digits and dashes.
# ============================================================================
# [[upstream]]
# name      = "work"
# file      = "outbounds/work.json"
# server_ip = ""

# ============================================================================
#  Profiles
#
#  A profile is a built-in policy plus destination-specific exceptions:
#  "behave like `base`, except send these domains/networks via somewhere else".
#  Assign one to a device with policy = "<profile name>".
#
#  base = "proxy" | "direct"   what unmatched traffic does
#  via  = an [[upstream]] name, or "proxy" / "direct" / "block"
#
#  Rules are matched most-specific-first: a profile rule beats the global
#  domestic-direct split, so work domains under .ir still reach the work
#  upstream.
#
#  NOTE: a profile device is always intercepted, even with base = "direct" —
#  splitting traffic by destination requires Xray to see it. So a profile
#  device is fail-closed like any proxied one: if the tunnel dies, it loses
#  connectivity rather than falling back to a direct path.
# ============================================================================
# [[profile]]
# name = "work-laptop"
# base = "proxy"
#
#   [[profile.route]]
#   via     = "work"
#   domains = ["domain:corp.work.example", "domain:jira.work.example"]
#   ips     = ["10.20.0.0/16", "203.0.113.0/24"]
#
#   [[profile.route]]
#   via     = "block"
#   domains = ["geosite:category-ads-all"]

# ============================================================================
#  Split routing — what goes direct vs through the tunnel
# ============================================================================
[routing]
direct_geosite = ["geosite:private", "geosite:category-ir"]
direct_geoip   = ["geoip:private", "geoip:ir"]
block_geosite  = ["geosite:category-ads-all"]          # e.g. ["geosite:category-ads-all"]
block_bittorrent = true     # true = drop torrent traffic at the gateway

# ============================================================================
#  DNS
# ============================================================================
[dns]
# LAN-facing resolver (AdGuard Home).
adguard_port    = 53
adguard_ui_port = 3000
# Resolved through the tunnel. IP literals only — a hostname here would need
# DNS to resolve the DNS server.
upstreams_proxied = ["https://1.1.1.1/dns-query", "https://8.8.8.8/dns-query"]
# Resolved direct, for domestic names. Shecan / ISP / national resolvers.
upstreams_direct  = ["178.22.122.100", "185.51.200.2"]
# Domains sent to upstreams_direct.
direct_suffixes   = ["ir"]
bootstrap         = ["1.1.1.1", "8.8.8.8"]
blocklists = [
  "https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt",
  "https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt",
]
# Query log retention. Thin-client flash is small — keep this short.
querylog_days = 3
statslog_days = 7

# ============================================================================
#  Per-client policy
#
#  policy = "proxy"   intercepted and sent through Xray (split rules apply)
#           "direct"  forwarded straight out to the router, never touched
#           "block"   dropped at the gateway
#           "<name>"  any profile declared above
#
#  Listing a device here is how you OVERRIDE the default. Any device that
#  points its default gateway at this box gets [policy].default without being
#  listed at all — listing is only needed to opt something out.
#
#  A device that never points its gateway here is simply unaffected: it never
#  sends us a packet to match.
#
#  Give listed devices a static IP (or a router DHCP reservation) — policy is
#  keyed to the address.
# ============================================================================

[policy]
# Applies to every device that uses this box as its gateway and is not listed
# below. "proxy" means opting in is the only step: set the gateway, and the
# traffic is tunnelled and covered by the kill switch.
#
# Must live in this table. A bare `default_policy = ...` written after another
# [table] belongs to that table and is ignored — the loader rejects that now.
default = "proxy"

# Examples of overriding the default. Under default = "proxy" you do NOT need
# an entry to proxy a device — just point its gateway here.

[[client]]
ip     = "192.168.1.60"
name   = "tv"
policy = "direct"

[[client]]
ip     = "192.168.1.99"
name   = "iot-plug"
policy = "block"

# ============================================================================
#  Tailscale
# ============================================================================
[tailscale]
enabled        = true
ssh            = true
exit_node      = true      # advertise as exit node
subnet_router  = true      # advertise lan_cidr to the tailnet
# Exit-node traffic (from 100.64.0.0/10) goes through Xray, so a remote device
# using this box as its exit node comes out of your Xray server.
proxy_tailnet_egress = true
# Route tailscaled's own control-plane + DERP traffic through Xray. Needed if
# Tailscale is blocked upstream. Cost: when Xray dies, so does your remote
# admin path — hence the lifeline below.
route_control_via_xray = true
# After this many minutes of sustained tunnel failure, let tailscaled talk
# direct so you can still SSH in and fix things. 0 disables the lifeline.
lifeline_after_min = 10

# ============================================================================
#  Web dashboard
#
#  Status + client management, served by the box itself. Three independent
#  gates, because this thing can change the firewall:
#    1. nftables only accepts the port from allow_cidrs
#    2. the app re-checks the peer address against allow_cidrs
#    3. a password (set with `gw web-passwd`, scrypt-hashed outside the repo)
#
#  The peer address comes from the socket. X-Forwarded-For is deliberately
#  ignored — nothing proxies this, so a header claiming otherwise is a lie.
# ============================================================================
[web]
enabled = true
listen  = "0.0.0.0"
port    = 8088

# Self-signed by default (scripts/40-web.sh generates it). Your browser will
# warn once. It is worth it: the login password crosses the LAN otherwise.
# A LAN attacker can still substitute their own cert and you would click
# through — reach it over Tailscale if that matters to you.
tls  = true
cert = "/etc/gateway/web.crt"
key  = "/etc/gateway/web.key"

# Who may reach the dashboard at all. Empty = lan_cidr + the tailnet.
allow_cidrs = []

session_hours     = 12
max_failed_logins = 5
lockout_minutes   = 15

# ============================================================================
#  Health watchdog
# ============================================================================
[health]
interval_sec        = 30
probe_url           = "https://www.gstatic.com/generate_204"
probe_timeout_sec   = 8
# A domestic site, used by `gw check` to prove the split is really splitting.
domestic_probe_url  = "https://www.irna.ir"
restart_after_fails = 3     # consecutive failures before restarting Xray
fallback_after_fails = 6    # before switching to [xray.fallback]

# ============================================================================
#  System
# ============================================================================
[system]
timezone         = "Asia/Tehran"
journal_max_use  = "200M"
zram             = true
bbr              = true
unattended_upgrades = true
# SSH stays reachable from these sources only.
ssh_allow_lan    = true
ssh_allow_tailnet = true
