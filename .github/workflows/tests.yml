name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch — the suite is fast, but a queue of
# stale runs on a busy branch is just noise.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          # Matches what Debian 13 ships, which is what the box builds with.
          # Testing on a newer toolchain than the target lets a build failure
          # reach the gateway instead of CI — which is exactly what happened
          # once, mid-migration, on a box whose gw had already been deleted.
          go-version: "1.24"
          # Never silently fetch a newer toolchain: that would hide the very
          # failure this pin exists to catch.
          check-latest: false

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          # nftables: every generated ruleset is fed to a real `nft -c`
          # sudo:     provides visudo, which validates the sudoers fragment
          sudo apt-get install -y --no-install-recommends nftables sudo

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal *.go)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet -mod=vendor ./...

      - name: test
        run: go test -mod=vendor ./...

      - name: race
        run: go test -mod=vendor -race ./...

      - name: Refuse a newer toolchain
        # GOTOOLCHAIN=local makes Go fail rather than download a newer release
        # when something requires one. The box has no second toolchain and no
        # way to fetch one when the tunnel it is meant to build is down.
        run: GOTOOLCHAIN=local go build -mod=vendor -o /dev/null ./cmd/gw

      - name: Build with the network off
        # Dependencies are vendored so a gateway with no working internet can
        # still build the binary that fixes it. This proves that stays true.
        run: CGO_ENABLED=0 GOFLAGS=-mod=vendor GOPROXY=off go build -o /dev/null ./cmd/gw

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci
        working-directory: dashboard

      - name: Typecheck
        run: npm run lint
        working-directory: dashboard

      - name: Build
        run: npm run build
        working-directory: dashboard

      - name: The committed build must match its source
        # dist/ is committed so the box builds with Go alone and never needs
        # Node. That only holds if the committed output is actually what the
        # source produces — otherwise the binary ships a dashboard nobody wrote.
        run: |
          if ! git diff --quiet -- dashboard/dist; then
            echo "dashboard/dist does not match a fresh build of dashboard/src."
            echo "Run: make dashboard && git add dashboard/dist"
            git diff --stat -- dashboard/dist
            exit 1
          fi
          echo "dist/ matches its source"

  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          # nftables: the suite feeds every generated ruleset to a real `nft -c`
          # sudo:     provides visudo, which validates the dashboard's sudoers file
          # jq:       validates the committed example outbounds
          # zip:      the updater tests build release archives to install from
          sudo apt-get install -y --no-install-recommends nftables sudo jq zip

      - name: Show versions
        run: |
          go version
          nft --version
          bash --version | head -1

      - name: Check unprivileged user namespaces
        id: userns
        run: |
          # tests/run.sh validates rulesets inside `unshare -rn` when not root.
          # If the runner forbids that, fall back to running the suite as root
          # so nft validation still happens rather than being skipped.
          if unshare -rn true 2>/dev/null; then
            echo "mode=user" >> "$GITHUB_OUTPUT"
          else
            echo "mode=root" >> "$GITHUB_OUTPUT"
            echo "::notice::user namespaces unavailable, running the suite as root"
          fi

      - name: Run the test suite
        run: |
          if [ "${{ steps.userns.outputs.mode }}" = "root" ]; then
            sudo -E ./tests/run.sh
          else
            ./tests/run.sh
          fi

      # Fixture freshness is checked by TestFixturesAreGenerated in the `go`
      # job: it derives every fixture from gateway.example.toml and fails if a
      # committed one has drifted. A stale fixture silently stops testing what
      # it was written for, and the golden files are built from these, so it
      # would quietly invalidate the renderer's acceptance test too.

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck

      - name: Lint shell
        run: |
          # Blocking at warning level. These scripts run as root on a box that
          # is someone's only route to the internet — SC2221 already caught a
          # case glob that installed root-owned job scripts world-readable.
          shellcheck --severity=warning --shell=bash \
            lib/common.sh scripts/*.sh templates/lib/*.sh tests/run.sh
